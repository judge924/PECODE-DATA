name: 🏛️ 국회 위원회 올인원 데이터 자동 수집 및 Supabase 누적 엔진

on:
  schedule:
    # 한국시간(KST) 매일 새벽 03:30 정기 실행 (UTC 기준 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # 깃허브 웹에서 수동 실행(Run workflow) 가능

permissions:
  contents: write

jobs:
  collect-committee-all:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 세팅 (ESM 모듈 호환)
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm pkg set type="module"
          fi

      # ⭐️ [비공개 레포 연동]: judge924/PECODE에서 3대 핵심 수집기 가져오기
      - name: 비공개 핵심 스크립트 로드
        uses: actions/checkout@v4
        with:
          repository: judge924/PECODE
          token: ${{ secrets.CORE_ACCESS_TOKEN }}
          path: temp_private_repo

      # ⭐️ [수집 실행 및 즉시 소멸]: 3단계 수집 엔진 가동 후 영구 파기
      - name: 위원회 마스터 및 4대 활동 데이터 Supabase 누적
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # 1. 비공개 스크립트 3종 복사
          cp temp_private_repo/scripts/fetchCommittees.js ./fetchCommittees.js
          cp temp_private_repo/scripts/fetchCommitteeActivities.js ./fetchCommitteeActivities.js
          cp temp_private_repo/scripts/fetchCommitteeBillsAndRecords.js ./fetchCommitteeBillsAndRecords.js
          mkdir -p src/data
          
          # 2. 임시 비공개 레포 폴더 즉시 영구 삭제 (보안 파기)
          rm -rf temp_private_repo
          
          # 3. [1단계] 위원회 마스터 및 위원·보좌진 수집
          echo "=== 1. 위원회 마스터 수집 ==="
          node fetchCommittees.js
          
          # 4. [2단계] 회의 일정 및 정책 자료실 수집
          echo "=== 2. 회의 일정 & 정책 자료실 수집 ==="
          node fetchCommitteeActivities.js
          
          # 5. [3단계] 계류 법률안 및 회의록(PDF 링크) 수집
          echo "=== 3. 계류 법률안 & 회의록 수집 ==="
          node fetchCommitteeBillsAndRecords.js
          
          # 6. 실행 직후 현재 디렉토리의 스크립트 3종 즉시 영구 삭제 (보안 파기)
          rm -f ./fetchCommittees.js ./fetchCommitteeActivities.js ./fetchCommitteeBillsAndRecords.js

      # ⭐️ 최신 백업본 커밋 & 푸시 (충돌 방지 rebase 적용)
      - name: 위원회 데이터셋 일괄 자동 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/committees.json src/data/committee_schedules.json src/data/committee_reports.json src/data/committee_bills.json src/data/committee_records.json
          git diff --staged --quiet || (git commit -m "chore: 위원회 4대 입법활동 데이터 동기화 ($(date +'%Y-%m-%d %H:%M:%S'))" && git pull --rebase origin main && git push)
