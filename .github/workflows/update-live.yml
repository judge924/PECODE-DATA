name: 🔴 실시간 정치 유튜브 라이브 데이터 수집 (무제한 무료 엔진)

on:
  schedule:
    # 공개 저장소이므로 5분마다 24시간 내내 1년 내내 돌려도 완전 무료(0원)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 트리거

permissions:
  contents: write

jobs:
  collect-live:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 세팅 (ESM 모듈 호환)
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm pkg set type="module"
          fi

      - name: 라이브 데이터 수집 및 Supabase 누적
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node fetchLive.js

      - name: 변경된 live.json 자동 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --staged --quiet || (git commit -m "chore: live.json 실시간 갱신 ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
