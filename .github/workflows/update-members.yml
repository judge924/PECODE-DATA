name: 🏛️ 국회의원 마스터 데이터 자동 수집 및 Supabase 누적 엔진

on:
  schedule:
    # 한국시간(KST) 매일 새벽 03:00 정기 실행 (UTC 기준 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 깃허브 웹에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect-members:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 세팅 (ESM 모듈 호환)
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm pkg set type="module"
          fi

      # ⭐️ [비공개 레포 연동]: judge924/PECODE에서 스크립트 및 아카이브 가져오기
      - name: 비공개 핵심 스크립트 로드
        uses: actions/checkout@v4
        with:
          repository: judge924/PECODE
          token: ${{ secrets.CORE_ACCESS_TOKEN }}
          path: temp_private_repo

      # ⭐️ [수집 실행 및 즉시 삭제]: 비공개 스크립트 실행 후 Supabase 직납 및 소멸
      - name: 국회의원 데이터 수집 및 Supabase 누적
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # 1. 비공개 레포의 fetchData.js 및 선관위 아카이브 복사
          cp temp_private_repo/scripts/fetchData.js ./fetchData.js
          mkdir -p src/data
          cp temp_private_repo/src/data/nec-winners-archive.json src/data/nec-winners-archive.json
          
          # 2. 임시 비공개 레포 폴더 전체 즉시 영구 삭제 (보안 파기)
          rm -rf temp_private_repo
          
          # 3. 수집기 실행 (3,296명 전체 Supabase 업서트 및 로컬 politicians.json 생성)
          node fetchData.js
          
          # 4. 실행 직후 현재 디렉토리의 fetchData.js 즉시 영구 삭제 (보안 파기)
          rm -f ./fetchData.js

      # ⭐️ 수집된 최신 백업본 커밋 (정상 작동 모니터링용)
      - name: 변경된 politicians.json 자동 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/politicians.json
          git diff --staged --quiet || (git commit -m "chore: politicians.json 국회의원 데이터 갱신 ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
